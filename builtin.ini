# deployment-repo-tool configuration for accelerator controls, compiled into
# the binary by make. Nothing is read from disk at run time: edit this file,
# then ./install.sh. `ioc --config FILE` uses a file instead, for trying a
# change and for the tests.
#
# There is nothing to clone. Each repo below is fetched into a bare repo the
# tool keeps for itself under ~/.cache/deployment-repo-tool/, edited there and
# pushed, over SSH with your own GitLab key.


[repos]
# key = the deployment repo's GitLab SSH URL.
fe = git@gitlab.diamond.ac.uk:controls/containers/accelerator/fe-deployment.git
va = git@gitlab.diamond.ac.uk:controls/containers/accelerator/va-deployment.git
id = git@gitlab.diamond.ac.uk:controls/containers/accelerator/id-deployment.git
pc = git@gitlab.diamond.ac.uk:controls/containers/accelerator/pc-deployment.git
rf = git@gitlab.diamond.ac.uk:controls/containers/accelerator/rf-deployment.git
di = git@gitlab.diamond.ac.uk:controls/containers/accelerator/di-deployment.git
rs = git@gitlab.diamond.ac.uk:controls/containers/accelerator/rs-deployment.git
bms = git@gitlab.diamond.ac.uk:controls/containers/accelerator/bms-deployment.git


[match]
# Which repo a SERVICE belongs to, so that -r is not needed. Comma separated
# globs, matched against the SERVICE argument exactly as you typed it. The
# first repo listed whose patterns match wins, so keep them specific: the
# storage ring IOCs in va, id and pc all start sr*, and only the -va-/-cs-/-pc-
# part tells them apart.
#
# Because it is the argument that is matched, a half written glob may not
# identify anything: `fe15*` matches `fe*` and lands on fe, but `sr2*` has
# nothing of `-va-ioc-` in it yet. Write `sr2*-va-ioc-*`, or use -r va.
#
# Each repo's own <repo>-epics-* services (pvcs, opis, gateways) are covered by
# the <repo>-* pattern.
fe = fe*
va = sr*-va-ioc-*, va-*
id = sr*-cs-ioc-*, id-*
pc = sr*-pc-ioc-*, pc-*
rf = li-rf-*, rf-*
di = cs-di-*, di-*
rs = ts-rs-*, rs-*
bms = bms-*


# Shorthand usable in place of a SERVICE, per repo: [<repo key>.aliases]
# A shorthand name selects its repo by itself, so `ioc stop cs` needs no -r.
# The same name in two repos (both define `all`) needs -r to say which.

[fe.aliases]
all = fe[0-9]*
cs = fe[0-9][0-9][ijkb]-cs-ioc-0[1-9]
mo = fe[0-9][0-9][ijkb]-mo-ioc-0[1-9]
py = fe[0-9][0-9][ijkb]-py-ioc-0[1-9]

[va.aliases]
all = sr[0-2][0-9]c-va-ioc-[0-9][0-9]

[id.aliases]
all = sr[0-2][0-9][a-z]-cs-ioc-[0-9][0-9]

[pc.aliases]
all = sr[0-2][0-9][a-z]-pc-ioc-[0-9][0-9]

[di.aliases]
all = cs-di-ioc-[0-9][0-9]

[rs.aliases]
all = ts-rs-rdmon-[0-9][0-9]


[general]
# Repo to fall back on when nothing above identifies one. Left off on purpose:
# a name that matches nothing is usually a typo or a half written glob, and an
# error naming the configured repos is more use than quietly picking one.
# default = fe
